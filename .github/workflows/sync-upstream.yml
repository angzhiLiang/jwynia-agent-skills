name: sync-upstream
on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync from upstream
        run: |
          git config user.name sync-bot
          git config user.email angzhiLiang@users.noreply.github.com
          git remote add upstream https://github.com/jwynia/agent-skills.git
          git fetch upstream main
          rm -rf skills
          git checkout upstream/main -- skills/general/communication/presentation-design
          mv skills/general/communication/presentation-design /tmp/pd
          rm -rf skills
          mkdir -p skills
          mv /tmp/pd skills/presentation-design
          find skills -name '.DS_Store' -delete
          git add -A
          git diff --cached --quiet || { git commit -m "sync upstream $(git rev-parse --short upstream/main)"; git push; }
